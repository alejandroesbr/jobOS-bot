[project]
name = "jobos-bot"
version = "2.0.0"
description = "Motor concurrente de inteligencia laboral con Clean Architecture, CQS, Multi-Worker Playwright, Grafo en Obsidian (Graphify) y servidor MCP On-Demand."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
