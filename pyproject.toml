[project]
name = "jobos-bot"
version = "0.1.0"
description = "Hexagonal Python copilot for multi-portal job scraping, weighted matching, assisted form filling, and MCP integration."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

