services:
  jobos:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./vault:/app/vault
      - ./exports:/app/exports
    environment:
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - VAULT_PATH=/app/vault
      - HEADLESS=true
