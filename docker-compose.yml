services:
  jobos:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./interviews:/app/interviews
      - ./followups:/app/followups
      - ./exports:/app/exports
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - HEADLESS=true
